services:
  # ── Backend API (Python / FastAPI) ────────────────────────────────────────
  - type: web
    name: applybot-api
    env: python
    region: oregon
    plan: free
    rootDir: applybot-backend
    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium --with-deps
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: applybot-db
          property: connectionString

  # ── Frontend (React / Vite static site) ──────────────────────────────────
  - type: web
    name: applybot-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: applybot-api
          type: web
          property: host
      - key: VITE_BASE_URL
        value: /

databases:
  - name: applybot-db
    plan: free
